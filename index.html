<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>HUD Don Cibercisco — V1</title>
<style>
  :root { --rosa:#ff2bd6; --cian:#22e6ff; --amar:#ffd23a; --rojo:#ff2244; --c1:#1546ff; --c2:#8fe3ff; --pulso:1.2s; }
  * { box-sizing:border-box; }
  body { margin:0; background:#0b0b10; color:#eee; font-family:"Segoe UI",system-ui,sans-serif; }
  header { padding:22px 32px 4px; }
  header h1 { margin:0; font-size:26px; }
  header p { margin:6px 0 0; color:#9aa; max-width:900px; line-height:1.45; }
  .opcion { margin:18px 32px; background:#14141c; border:1px solid #262636; border-radius:14px; padding:16px; max-width:1000px; }
  .pantalla { position:relative; height:400px; border-radius:10px; overflow:hidden;
    background: radial-gradient(ellipse at 50% 130%, #2b4f7a 0%, #16243a 45%, #0a0e18 100%); }
  .pantalla::after { content:""; position:absolute; left:0; right:0; bottom:0; height:90px;
    background: linear-gradient(#0000, #9fd3ff33), repeating-linear-gradient(90deg,#ffffff10 0 2px,#0000 2px 80px); }
  #rayos { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; mix-blend-mode:screen; }
  .controles { display:flex; gap:10px; margin-top:12px; align-items:center; }
  button { font: 600 15px "Segoe UI",sans-serif; padding:10px 18px; border-radius:9px; border:0; cursor:pointer; }
  .b-dano { background:var(--rojo); color:#fff; box-shadow:0 6px 18px #ff224455; }
  .b-dano:active { transform:translateY(1px); }
  .b-reset { background:#2a2a3a; color:#ccd; }
  .estado { color:#aab; font-size:14px; }
  .nivel { display:flex; gap:4px; margin-left:auto; align-items:center; font-size:13px; color:#aab; }
  .nivel i { width:16px; height:8px; border-radius:2px; background:#2a2a3a; display:inline-block; }
  .nivel i.on { background:var(--rojo); box-shadow:0 0 6px var(--rojo); }

  .hud { position:absolute; left:50%; top:18px; width:640px; height:116px; transform:translateX(-50%); z-index:4; }
  .anillo { position:absolute; left:0; top:2px; width:112px; height:112px; border-radius:50%; padding:5px; z-index:2;
    background: conic-gradient(var(--c1), var(--c2), var(--c1)); box-shadow:0 0 22px var(--c1); animation: late var(--pulso) infinite alternate; }
  .anillo canvas { width:102px; height:102px; border-radius:50%; background:#0d0d14; display:block; }
  .borde { position:absolute; left:96px; top:38px; right:-4px; height:60px; animation: late var(--pulso) infinite alternate;
    clip-path: polygon(0 0, calc(100% - 26px) 0, 100% 50%, calc(100% - 26px) 100%, 0 100%);
    background: linear-gradient(90deg, var(--c1), var(--c2) 50%, var(--c1)); }
  .marco { position:absolute; left:100px; top:42px; right:0; height:52px; background:#050508;
    clip-path: polygon(0 0, calc(100% - 24px) 0, 100% 50%, calc(100% - 24px) 100%, 0 100%); }
  .relleno { position:absolute; left:22px; top:6px; bottom:6px; right:28px; display:flex; gap:4px; }
  .blk { flex:1; position:relative; overflow:hidden; border-radius:2px; }
  .blk canvas { width:100%; height:100%; image-rendering:pixelated; display:block; }
  /* vida perdida = espacio NEGRO */
  .blk { background:#000; box-shadow: inset 0 0 0 1px #ffffff14; }
  .blk canvas { opacity:.35; }
  .blk.listo canvas { opacity:0; }
  .blk.listo { background: linear-gradient(90deg, #1546ff, #2f8bff 45%, #8fe3ff); box-shadow: inset 0 0 8px #ffffffaa, 0 0 10px #3fa8ff; animation: carga .5s; }
  .blk.listo::after { content:""; position:absolute; inset:0; background: linear-gradient(100deg, #0000 30%, #ffffffaa 50%, #0000 70%); background-size:300% 100%; animation: brillo 1.6s infinite linear; }
  @keyframes carga { 0%{ transform:scaleY(.2); filter:brightness(3) } 100%{ transform:none; filter:none } }
  @keyframes brillo { from { background-position:150% 0 } to { background-position:-150% 0 } }
  .update { position:absolute; left:124px; top:102px; font: 700 13px/1 Consolas,monospace; color:#9fe8ff; white-space:nowrap; opacity:0; z-index:3; }
  .update.on { opacity:1; animation: parp 1s infinite steps(2); }
  @keyframes parp { 50% { opacity:.55 } }
  @keyframes apaga { 0%{background:#ff2244} 100%{background:#000} }
  .nombre { position:absolute; left:124px; top:6px; font: 900 22px/1 "Arial Black",Impact,sans-serif; letter-spacing:2px; white-space:nowrap; }
  .pct { position:absolute; right:30px; top:10px; font: 800 15px/1 Consolas,monospace; white-space:nowrap; }
  .pct b { color:var(--c1); }
  .glitch { position:relative; color:#fff; text-shadow: 2px 0 #1546ff, -2px 0 #8fe3ff; }
  .glitch::before, .glitch::after { content:attr(data-t); position:absolute; left:0; top:0; overflow:hidden; }
  .glitch::before { color:#8fe3ff; clip-path: inset(0 0 55% 0); animation: corte 2.6s infinite steps(1); }
  .glitch::after  { color:#2f6bff; clip-path: inset(60% 0 0 0); animation: corte 2.1s infinite reverse steps(1); }
  @keyframes corte { 0%,86%,100% { transform:none } 88% { transform:translate(4px,-1px) } 92% { transform:translate(-5px,1px) } 95% { transform:translate(2px,0) } }
  @keyframes late { to { filter: brightness(1.7) } }
  .golpe { animation: sacudida .38s; }
  @keyframes sacudida { 0%{transform:translateX(-50%)} 20%{transform:translate(calc(-50% - var(--s)),3px)} 40%{transform:translate(calc(-50% + var(--s)),-3px)} 60%{transform:translate(calc(-50% - var(--s)/2),2px)} 80%{transform:translate(calc(-50% + var(--s)/3),0)} 100%{transform:translateX(-50%)} }
  .menos { position:absolute; font: 900 28px "Arial Black",Impact,sans-serif; color:var(--amar); text-shadow:0 0 10px #f80, 2px 2px 0 #000; pointer-events:none; animation: sube 1s forwards; z-index:9; }
  @keyframes sube { 0%{opacity:0; transform:translateY(8px) scale(.6)} 15%{opacity:1; transform:translateY(0) scale(1.25)} 100%{opacity:0; transform:translateY(-44px) scale(1)} }
  .pixel { position:absolute; pointer-events:none; animation: cae .9s forwards ease-in; z-index:8; }
  @keyframes cae { to { transform: translate(var(--dx), var(--dy)) rotate(var(--r)); opacity:0 } }
  .aviso { position:absolute; left:50%; top:66%; transform:translate(-50%,-50%); font: 900 36px "Arial Black",Impact,sans-serif; letter-spacing:2px; opacity:0; pointer-events:none; white-space:pre-line; text-align:center; line-height:1.1; z-index:9; }
  .aviso.on { animation: aviso var(--dur, 1.8s) forwards; }
  .aviso.fijo { opacity:1; top:50%; font-size:40px; animation: entraFijo .7s; }
  @keyframes entraFijo { from { opacity:0; transform:translate(-50%,-50%) scale(1.6); } }
  @keyframes aviso { 0%{opacity:0; transform:translate(-50%,-50%) scale(1.7)} 12%{opacity:1; transform:translate(-50%,-50%) scale(1)} 78%{opacity:1} 100%{opacity:0} }
  .globo { position:absolute; left:calc(50% - 300px); top:142px; max-width:360px; background:#fff; color:#111; z-index:9;
    font: 900 19px/1.15 "Arial Black",Impact,sans-serif; padding:10px 14px; border-radius:14px; box-shadow: 4px 4px 0 #1546ff, -3px -2px 0 #8fe3ff;
    opacity:0; transform: scale(.6); transform-origin: 20px 0; pointer-events:none; }
  .globo::before { content:""; position:absolute; left:22px; top:-12px; border:12px solid transparent; border-top:0; border-bottom-color:#fff; }
  .globo.on { animation: globo var(--dur, 2.6s) forwards; }
  @keyframes globo { 0%{opacity:0; transform:scale(.6) rotate(-4deg)} 8%{opacity:1; transform:scale(1.08) rotate(1deg)} 14%{transform:scale(1) rotate(0)} 85%{opacity:1} 100%{opacity:0} }
  .eventos { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .eventos button { background:#23233a; color:#dde; font-size:13.5px; padding:8px 12px; }
  .eventos button:disabled { opacity:.45; cursor:not-allowed; }
  .comercial { position:absolute; inset:0; z-index:10; display:none; place-items:center; background: repeating-linear-gradient(90deg,#ffd23a 0 12%,#22e6ff 12% 24%,#ff2bd6 24% 36%,#3dff8a 36% 48%,#8a5cff 48% 60%,#ff2244 60% 72%,#fff 72% 84%,#111 84% 100%); }
  .comercial.on { display:grid; animation: tv .25s steps(2) 2; }
  .comercial div { background:#000c; color:#fff; font: 900 34px "Arial Black",Impact,sans-serif; padding:14px 26px; border-radius:10px; text-align:center; }
  .comercial small { display:block; font-size:16px; color:#ffd23a; margin-top:6px; }
  @keyframes tv { 50% { filter: invert(1); } }
  .terminal { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:640px; z-index:12; text-align:center; display:none;
    background:#030a1acc; border:2px solid #2f8bff; border-radius:10px; box-shadow:0 0 24px #2f8bff88; padding:12px 16px 14px;
    font: 600 14.5px/1.55 Consolas, monospace; color:#bfe6ff; }
  .terminal.on { display:block; animation: entra .3s; }
  @keyframes entra { from { transform:translate(-50%,-50%) scale(.85); opacity:0 } }
  .terminal h3 { margin:0 0 6px; font: 900 17px Consolas,monospace; color:#fff; letter-spacing:1px; }
  .terminal .l { white-space:nowrap; overflow:hidden; }
  .terminal .l b { float:right; }
  /* un ítem a la vez, grande y al centro */
  .terminal .l.uno { white-space:normal; font: 900 34px/1.2 Consolas,monospace; color:#fff; margin:10px 0 4px; animation: item .32s ease-out; }
  .terminal .l.uno b { float:none; display:block; font-size:30px; margin-top:6px; }
  @keyframes item { 0%{opacity:0; transform:translateY(14px) scale(.9); filter:blur(3px)} 100%{opacity:1; transform:none; filter:none} }
  .terminal .cont { color:#5d8fc0; font: 700 13px Consolas,monospace; margin-top:4px; }
  .terminal .ok { color:#5dffa0; } .terminal .meh { color:#ffd23a; } .terminal .top { color:#8fe3ff; text-shadow:0 0 8px #8fe3ff; }
  .terminal .prog { height:8px; background:#0b1d3a; border-radius:4px; margin-top:8px; overflow:hidden; }
  .terminal .prog i { display:block; height:100%; width:0; background: linear-gradient(90deg,#1546ff,#8fe3ff); transition: width .4s; }
  .hud.restaurando .anillo { transform: scale(1.25); transition: transform .5s; box-shadow: 0 0 40px #8fe3ff; }
  /* HUD que se va (glitch y se apaga como tele) y vuelve */
  .hud.sale { animation: sale 1.1s forwards; }
  @keyframes sale { 0%{opacity:1; filter:none} 15%{transform:translate(calc(-50% + 12px),0) skewX(12deg); filter:hue-rotate(90deg)} 30%{transform:translate(calc(-50% - 10px),0) skewX(-10deg); opacity:.6}
    45%{transform:translateX(-50%); opacity:1} 70%{transform:translateX(-50%) scaleY(.05); filter:brightness(4)} 100%{transform:translateX(-50%) scale(0,.02); opacity:0} }
  .hud.vuelve { animation: vuelve .6s; }
  @keyframes vuelve { from { transform:translateX(-50%) scaleY(.05); opacity:0; filter:brightness(4) } }

  const W=ret.width, H=ret.height, x=rc; x.clearRect(0,0,W,H);
  if(!foto.naturalWidth) return;
  const S=512, sw=S/ZOOM, sx=(S-sw)/2;
  x.drawImage(foto, sx, sx, sw, sw, 0, 0, W, H);
  const e = enojo(), g = vida/N;
  // tinte rojo de enojo
  if(e>0){ x.globalCompositeOperation='source-atop'; x.globalAlpha=.06*e; x.fillStyle='#ff0022'; x.fillRect(0,0,W,H); x.globalAlpha=1; x.globalCompositeOperation='source-over'; }
  // glitch (baja con cada golpe)
  if(g>0){
    const d=g*W*.045*Math.random(); x.globalCompositeOperation='lighter'; x.globalAlpha=.3*g; x.drawImage(ret,-d,0); x.globalAlpha=1; x.globalCompositeOperation='source-over';
    for(let i=0;i<Math.round(6*g);i++){ const y=Math.random()*H, h=2+Math.random()*H*.08, o=(Math.random()-.5)*W*.22*g; x.drawImage(ret,0,y,W,h,o,y,W,h); }
    for(let i=0;i<Math.round(12*g);i++){ x.fillStyle=PAL[(Math.random()*8)|0]; const s=W*(.02+Math.random()*.05); x.fillRect(Math.random()*W, Math.random()*H, s*(1+Math.random()*2), s*.6); }
  }
  // OJOS ROJOS SIEMPRE: brillo en cada lente (más fuerte con el enojo, parpadeo)
  const f = .75 + Math.random()*.25, rad = W*(.07 + .012*e);
  for(const o of OJOS){ const [cx,cy]=ojoEnCanvas(o);
    const gr=x.createRadialGradient(cx,cy,0,cx,cy,rad*2.2);
    gr.addColorStop(0, `rgba(255,255,255,${.95*f})`); gr.addColorStop(.18, `rgba(255,40,60,${.95*f})`); gr.addColorStop(.55, `rgba(255,0,30,${.35*f})`); gr.addColorStop(1,'rgba(255,0,30,0)');
    x.globalCompositeOperation='lighter'; x.fillStyle=gr; x.beginPath(); x.ellipse(cx,cy,rad*2.2,rad*1.4,0,0,7); x.fill(); x.globalCompositeOperation='source-over'; }
}

let t0 = performance.now();
function pintarRayos(){
  const r = pant.getBoundingClientRect(); if(ray.width!==r.width){ ray.width=r.width; ray.height=r.height; }
  yc.clearRect(0,0,ray.width,ray.height);
  const e = enojo(); if(e===0 || vida===0) return;           // rayos desde el primer golpe
  const cr = ret.getBoundingClientRect(), k = cr.width/ret.width, t=(performance.now()-t0)/1000;
  const largo = 120 + e*70, ancho = 2 + e*2.2, barrido = .25 + e*.05;
  OJOS.forEach((o,i)=>{
    const [px,py]=ojoEnCanvas(o); const x0=cr.left-r.left+px*k, y0=cr.top-r.top+py*k;
    const ang = Math.PI/2 + (i?-.35:.35) + Math.sin(t*(2+e*.6)+i*1.7)*barrido;   // hacia abajo, abiertos y barriendo
    const x1=x0+Math.cos(ang)*largo, y1=y0+Math.sin(ang)*largo;
    const fl = .8+Math.random()*.2;
    for(const [w,c] of [[ancho*5,`rgba(255,0,40,${.18*fl})`],[ancho*2.4,`rgba(255,30,60,${.45*fl})`],[ancho,`rgba(255,150,150,${.95*fl})`]]){
      const gr=yc.createLinearGradient(x0,y0,x1,y1); gr.addColorStop(0,c); gr.addColorStop(1,'rgba(255,0,40,0)');
      yc.strokeStyle=gr; yc.lineWidth=w; yc.lineCap='round'; yc.beginPath(); yc.moveTo(x0,y0); yc.lineTo(x1,y1); yc.stroke(); }
    // chispas en la punta
    for(let s=0;s<e*2;s++){ yc.fillStyle=PAL[[3,7,6][(Math.random()*3)|0]]; const q=.6+Math.random()*.4; yc.fillRect(x0+(x1-x0)*q+(Math.random()-.5)*14, y0+(y1-y0)*q+(Math.random()-.5)*14, 3, 3); }
  });
}

function pintar(){
  // la barra se LLENA: cada golpe restaura un bloque (de menos a más)
  bloques.forEach((c,i)=> c.parentElement.classList.toggle('listo', i < N - vida));
  document.getElementById('pct').textContent = Math.round((N - vida) / N * 100) + '%';
  document.getElementById('update').classList.toggle('on', vida === 1);
  const e=enojo(), n=NIV[vida===0?0:e];
  document.documentElement.style.setProperty('--c1', vida===0 ? '#555' : n[0]);
  document.documentElement.style.setProperty('--c2', vida===0 ? '#333' : n[1]);
  document.documentElement.style.setProperty('--pulso', vida===0 ? '99s' : n[2]);
  hud.style.setProperty('--s', (6 + e*4)+'px');
  [...document.querySelectorAll('#nivel i')].forEach((el,i)=>el.classList.toggle('on', vida>0 && i<e));
  document.getElementById('estado').textContent = vida===0 ? 'Restaurado' : (e===0 ? 'Tranquilo (pero con ojos rojos)' : 'Enojo nivel '+e);
}
function aviso(t,col){ const a=document.getElementById('aviso'); a.style.setProperty('--dur', (duracion(t)*0.8)+'s'); a.textContent=t; a.dataset.t=t; a.style.color=col; a.classList.remove('on'); void a.offsetWidth; a.classList.add('on'); }
function dano(){
  if(vida<=0) return; vida--;
  const r=bloques[N-1-vida].parentElement.getBoundingClientRect(), pr=pant.getBoundingClientRect();
  for(let i=0;i<24;i++){ const p=document.createElement('div'); p.className='pixel'; const s=4+Math.random()*8;
    Object.assign(p.style,{left:(r.left-pr.left+Math.random()*r.width)+'px', top:(r.top-pr.top+Math.random()*r.height)+'px', width:s+'px', height:s+'px', background:PAL[(Math.random()*8)|0]});
    p.style.setProperty('--dx',(Math.random()*70-35)+'px'); p.style.setProperty('--dy',(30+Math.random()*80)+'px'); p.style.setProperty('--r',(Math.random()*360)+'deg');
    pant.appendChild(p); setTimeout(()=>p.remove(),950); }
  const m=document.createElement('div'); m.className='menos'; m.textContent='+'+Math.round(100/N)+'%'; m.style.left=(r.left-pr.left+r.width/2-12)+'px'; m.style.top=(r.top-pr.top-36)+'px'; pant.appendChild(m); setTimeout(()=>m.remove(),1000);
  hud.classList.remove('golpe'); void hud.offsetWidth; hud.classList.add('golpe');
  pintar();
  if(vida===0) restauracion(); else decir(FRASES[enojo()]);
}
function reset(){ vida=N; restaurando=false; tiempos.forEach(clearTimeout); tiempos.length=0; ['terminal','camara','camGrande','camSub','m0','m1'].forEach(id=>document.getElementById(id).classList.remove('on')); document.getElementById('aviso').classList.remove('fijo'); hud.classList.remove('sale','vuelve','restaurando'); pintar(); }
// ---------- RESTAURACIÓN FINAL: datos de reinicio chistosos, los últimos positivos ----------
const REGISTRO = [
  ['Actualizando chistes', 'FALLÓ (se quedan)', 'meh'],
  ['Reparando six seven', '67 %', 'meh'],
  ['Vente, vente', '¡AL CHILE ESTE NOVIEMBRE!', 'top'],
  ['Empatía', 'RESTAURADA', 'top'],
  ['Solidaridad', 'RESTAURADA ❤', 'top'],
];
let restaurando = false;
// 1) el HUD se va  2) CIBER-CAM: mira a los jugadores  3) reinicio en pantalla  4) vuelve el HUD restaurado
const ANALISIS = [
  'JUGADOR 1 · six seven: NIVEL MÁXIMO',
  'JUGADOR 2 · trae un cajín: ¡ME LO TIRÓ A MÍ!',
];
const tiempos = [];
function luego(ms, f){ tiempos.push(setTimeout(()=>{ if(restaurando) f(); }, ms)); }
function restauracion(){
  restaurando = true;
  const cam=document.getElementById('camara'), sub=document.getElementById('camSub'), gr=document.getElementById('camGrande'), est=document.getElementById('camEstado');
  const t=document.getElementById('terminal'), L=document.getElementById('lineas'), P=document.getElementById('prog');
  const decirCam = (txt)=>{ sub.textContent=txt; sub.classList.add('on'); };
  hud.classList.remove('vuelve'); hud.classList.add('sale');
  // CIBER-CAM unos segundos: los 2 jugadores marcados con miras (sin análisis) -> glitch -> reinicio
  luego(1200, ()=>{ cam.classList.add('on'); est.textContent='OBJETIVOS: 2'; });
  luego(1700, ()=> document.getElementById('m0').classList.add('on'));
  luego(2000, ()=> document.getElementById('m1').classList.add('on'));
  luego(4800, ()=>{ cam.classList.add('glitch'); est.textContent='ERROR'; });
  luego(5700, ()=>{ cam.classList.remove('on','glitch'); gr.classList.remove('on'); ['m0','m1'].forEach(id=>document.getElementById(id).classList.remove('on'));
    L.innerHTML=''; P.style.width='0'; t.classList.add('on'); });
  const PASO = 1800;
  REGISTRO.forEach(([txt, est2, cl], i)=> luego(6300 + i*PASO, ()=>{
    L.innerHTML=''; const d=document.createElement('div'); d.className='l uno'; d.innerHTML = txt+'… <b class="'+cl+'">'+est2+'</b><div class="cont">'+(i+1)+' / '+REGISTRO.length+'</div>'; L.appendChild(d);
    P.style.width = Math.round((i+1)/REGISTRO.length*100)+'%'; }));
  const fin = 6300 + REGISTRO.length*PASO + 1500;
  // final: el HUD NO vuelve; solo queda el texto de restauración
  luego(fin, ()=>{ t.classList.remove('on');
    const av=document.getElementById('aviso'); av.textContent='¡HA SIDO RESTAURADO' + String.fromCharCode(10) + 'DON CIBERCISCO!'; av.dataset.t=av.textContent;
    av.style.color='#9fe8ff'; av.classList.remove('on'); av.classList.add('fijo'); });
}
// ---------- frases reales en un globo ----------
// segundos en pantalla según el largo: 1.6 s + 0.075 s por letra (entre 2.2 y 6 s)
function duracion(t){ return Math.min(6, Math.max(2.2, 1.6 + 0.075 * t.length)); }
function decir(t){ const g=document.getElementById('globo'); g.textContent=t; g.style.setProperty('--dur', duracion(t)+'s'); g.classList.remove('on'); void g.offsetWidth; g.classList.add('on'); }

function evento(tipo){
  if(vida===0) return;
  if(tipo==='esquiva') decir('¿Qué dice el público?');
  if(tipo==='falla') decir('¿Cómo dice que dijo?');
  if(tipo==='patada') decir('¡A los leones!');
  if(tipo==='leones'){
    decir('¡Vamos a comerciales!');
    const c=document.getElementById('comercial'), q=document.getElementById('cuenta'); let n=5;
    setTimeout(()=>{ c.classList.add('on'); q.textContent='volvemos en '+n+'...';
      const iv=setInterval(()=>{ n--; if(n>0) q.textContent='volvemos en '+n+'...'; else { clearInterval(iv); c.classList.remove('on'); } }, 1000); }, 900);
  }
}

if(new URLSearchParams(location.search).has('sinanim')){ const st=document.createElement('style'); st.textContent='*,*::before,*::after{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}'; document.head.appendChild(st); }
foto.onload = () => { pintar(); const q=+(new URLSearchParams(location.search).get('golpes')||0); for(let i=0;i<q;i++) dano(); setInterval(()=>{ bloques.forEach((c,i)=>{ if(i >= N - vida) ruido(c); }); pintarRetrato(); }, 110); (function bucle(){ pintarRayos(); requestAnimationFrame(bucle); })(); };
